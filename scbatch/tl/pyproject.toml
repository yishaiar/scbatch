[project]
name = "scbatch-tl"
version = "0.1.0"
description = "Graph, embedding, and clustering workspace member for scbatch"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10.0,<0.11",
    "numpy>=1.26.0",
    "scanpy>=1.9.8,<1.10",
    "numba>=0.59.1,<0.60",
    "igraph>=1.0.0",
    "leidenalg>=0.10.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
]

[tool.uv]
package = false
